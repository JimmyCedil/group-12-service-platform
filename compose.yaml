services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: service_platform
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: service_platform
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U service_platform -d service_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: